[project]
name = "universal-ai-coprocessor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "PySide6>=6.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
